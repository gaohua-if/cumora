});
document.addEventListener('input',event=>{const e=event.target;if(e.id==='search'){query=e.value;renderList();return}if(e.dataset.field){if(current())current()[e.dataset.field]=e.value;mark()}if(e.dataset.binding&&current()){const o=current().bindings[e.dataset.binding]??={};o[e.dataset.key]=e.value;mark()}});
document.addEventListener('change',async event=>{const e=event.target;if(e.dataset.field){if(current())current()[e.dataset.field]=e.value;mark()}if(e.dataset.binding&&current()){const o=current().bindings[e.dataset.binding]??={};o[e.dataset.key]=e.value;mark()}if(e.id==='preview-channel'){modal.channelId=e.value;renderModal()}if(e.id==='preview-agent'){modal.agentId=e.value;renderModal()}if(e.id==='effective-agent'){document.querySelector('#tab-content').innerHTML=effective(current(),e.value,false)}if(e.id==='access-mode')document.querySelectorAll('#access-subset input').forEach(x=>x.disabled=e.value!=='subset');if(e.dataset.workspace){data.workspace.language=e.value;mark();}if(e.dataset.import){const file=e.files?.[0];if(!file)return;if(file.size>200000){toast('请选择小于 200 KB 的 Markdown 文件');return}const text=await file.text();if(e.dataset.import==='current-skill'){current().body=text;renderDetail();mark();toast('已载入 Skill 内容，请保存配置')}else{document.querySelector('#import-body').value=text;document.querySelector('#import-name').value=file.name.replace(/\.md$/i,'');}}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal){event.preventDefault();closeModal()}if(event.key==='Tab'&&modal){const all=[...document.querySelectorAll('#overlay-root button,#overlay-root input,#overlay-root select,#overlay-root textarea')].filter(e=>!e.disabled&&e.offsetParent!==null);if(!all.length)return;const first=all[0],last=all[all.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}if((event.metaKey||event.ctrlKey)&&event.key==='s'){event.preventDefault();if(!modal)save()}});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
const initial=location.hash.slice(1).split('/');if(categories[initial[0]]&&data[initial[0]].some(x=>x.id===initial[1])){view=initial[0];selected=initial[1];tab=categories[view].tabs.some(([id])=>id===initial[2])?initial[2]:categories[view].tabs[0][0]}
window.addEventListener('hashchange',()=>{const route=location.hash.slice(1).split('/');if(categories[route[0]]&&data[route[0]].some(x=>x.id===route[1]))requestNavigate(route[0],route[1],categories[route[0]].tabs.some(([id])=>id===route[2])?route[2]:undefined)});
render();
</script>
</body>
